backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pl"

collections:
  - name: "content"
    label: "Strona — treść"
    files:
      - name: "content"
        label: "Zdjęcia, galeria i blog"
        file: "content.json"
        fields:
          - label: "Шапка сайта"
            name: "bio"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Podtytuł (PL)", name: "header_subtitle_pl", widget: "string" }
              - { label: "Sous-titre (FR)", name: "header_subtitle_fr", widget: "string", required: false }
              - { label: "Подзаголовок (RU)", name: "header_subtitle_ru", widget: "string", required: false }
              - { label: "Subtitle (EN)", name: "header_subtitle_en", widget: "string", required: false }

              - { label: "Doświadczenie (PL)", name: "experience_line_pl", widget: "string" }
              - { label: "Expérience (FR)", name: "experience_line_fr", widget: "string", required: false }
              - { label: "Опыт (RU)", name: "experience_line_ru", widget: "string", required: false }
              - { label: "Experience (EN)", name: "experience_line_en", widget: "string", required: false }

              - { label: "O mnie — akapit 1 (PL)", name: "about_p1_pl", widget: "text" }
              - { label: "À propos — para 1 (FR)", name: "about_p1_fr", widget: "text", required: false }
              - { label: "О себе — абзац 1 (RU)", name: "about_p1_ru", widget: "text", required: false }
              - { label: "About — paragraph 1 (EN)", name: "about_p1_en", widget: "text", required: false }

              - { label: "O mnie — akapit 2 (PL)", name: "about_p2_pl", widget: "text" }
              - { label: "À propos — para 2 (FR)", name: "about_p2_fr", widget: "text", required: false }
              - { label: "О себе — абзац 2 (RU)", name: "about_p2_ru", widget: "text", required: false }
              - { label: "About — paragraph 2 (EN)", name: "about_p2_en", widget: "text", required: false }

              - { label: "Metoda 1 — nazwa (PL)", name: "m1_name_pl", widget: "string" }
              - { label: "Metoda 1 — opis (PL)", name: "m1_desc_pl", widget: "text" }
              - { label: "Méthode 1 — nom (FR)", name: "m1_name_fr", widget: "string", required: false }
              - { label: "Méthode 1 — description (FR)", name: "m1_desc_fr", widget: "text", required: false }
              - { label: "Метод 1 — название (RU)", name: "m1_name_ru", widget: "string", required: false }
              - { label: "Метод 1 — описание (RU)", name: "m1_desc_ru", widget: "text", required: false }
              - { label: "Method 1 — name (EN)", name: "m1_name_en", widget: "string", required: false }
              - { label: "Method 1 — description (EN)", name: "m1_desc_en", widget: "text", required: false }

              - { label: "Metoda 2 — nazwa (PL)", name: "m2_name_pl", widget: "string" }
              - { label: "Metoda 2 — opis (PL)", name: "m2_desc_pl", widget: "text" }
              - { label: "Méthode 2 — nom (FR)", name: "m2_name_fr", widget: "string", required: false }
              - { label: "Méthode 2 — description (FR)", name: "m2_desc_fr", widget: "text", required: false }
              - { label: "Метод 2 — название (RU)", name: "m2_name_ru", widget: "string", required: false }
              - { label: "Метод 2 — описание (RU)", name: "m2_desc_ru", widget: "text", required: false }
              - { label: "Method 2 — name (EN)", name: "m2_name_en", widget: "string", required: false }
              - { label: "Method 2 — description (EN)", name: "m2_desc_en", widget: "text", required: false }

              - { label: "Metoda 3 — nazwa (PL)", name: "m3_name_pl", widget: "string" }
              - { label: "Metoda 3 — opis (PL)", name: "m3_desc_pl", widget: "text" }
              - { label: "Méthode 3 — nom (FR)", name: "m3_name_fr", widget: "string", required: false }
              - { label: "Méthode 3 — description (FR)", name: "m3_desc_fr", widget: "text", required: false }
              - { label: "Метод 3 — название (RU)", name: "m3_name_ru", widget: "string", required: false }
              - { label: "Метод 3 — описание (RU)", name: "m3_desc_ru", widget: "text", required: false }
              - { label: "Method 3 — name (EN)", name: "m3_name_en", widget: "string", required: false }
              - { label: "Method 3 — description (EN)", name: "m3_desc_en", widget: "text", required: false }

              - { label: "Metoda 4 — nazwa (PL)", name: "m4_name_pl", widget: "string" }
              - { label: "Metoda 4 — opis (PL)", name: "m4_desc_pl", widget: "text" }
              - { label: "Méthode 4 — nom (FR)", name: "m4_name_fr", widget: "string", required: false }
              - { label: "Méthode 4 — description (FR)", name: "m4_desc_fr", widget: "text", required: false }
              - { label: "Метод 4 — название (RU)", name: "m4_name_ru", widget: "string", required: false }
              - { label: "Метод 4 — описание (RU)", name: "m4_desc_ru", widget: "text", required: false }
              - { label: "Method 4 — name (EN)", name: "m4_name_en", widget: "string", required: false }
              - { label: "Method 4 — description (EN)", name: "m4_desc_en", widget: "text", required: false }

              - { label: "Edukacja 1 — nagłówek (PL)", name: "edu1_year_pl", widget: "string" }
              - { label: "Edukacja 1 — opis (PL)", name: "edu1_text_pl", widget: "text" }
              - { label: "Éducation 1 — titre (FR)", name: "edu1_year_fr", widget: "string", required: false }
              - { label: "Éducation 1 — description (FR)", name: "edu1_text_fr", widget: "text", required: false }
              - { label: "Образование 1 — заголовок (RU)", name: "edu1_year_ru", widget: "string", required: false }
              - { label: "Образование 1 — описание (RU)", name: "edu1_text_ru", widget: "text", required: false }
              - { label: "Education 1 — title (EN)", name: "edu1_year_en", widget: "string", required: false }
              - { label: "Education 1 — description (EN)", name: "edu1_text_en", widget: "text", required: false }

              - { label: "Edukacja 2 — nagłówek (PL)", name: "edu2_year_pl", widget: "string" }
              - { label: "Edukacja 2 — opis (PL)", name: "edu2_text_pl", widget: "text" }
              - { label: "Éducation 2 — titre (FR)", name: "edu2_year_fr", widget: "string", required: false }
              - { label: "Éducation 2 — description (FR)", name: "edu2_text_fr", widget: "text", required: false }
              - { label: "Образование 2 — заголовок (RU)", name: "edu2_year_ru", widget: "string", required: false }
              - { label: "Образование 2 — описание (RU)", name: "edu2_text_ru", widget: "text", required: false }
              - { label: "Education 2 — title (EN)", name: "edu2_year_en", widget: "string", required: false }
              - { label: "Education 2 — description (EN)", name: "edu2_text_en", widget: "text", required: false }

              - { label: "Edukacja 3 — nagłówek (PL)", name: "edu3_year_pl", widget: "string" }
              - { label: "Edukacja 3 — opis (PL)", name: "edu3_text_pl", widget: "text" }
              - { label: "Éducation 3 — titre (FR)", name: "edu3_year_fr", widget: "string", required: false }
              - { label: "Éducation 3 — description (FR)", name: "edu3_text_fr", widget: "text", required: false }
              - { label: "Образование 3 — заголовок (RU)", name: "edu3_year_ru", widget: "string", required: false }
              - { label: "Образование 3 — описание (RU)", name: "edu3_text_ru", widget: "text", required: false }
              - { label: "Education 3 — title (EN)", name: "edu3_year_en", widget: "string", required: false }
              - { label: "Education 3 — description (EN)", name: "edu3_text_en", widget: "text", required: false }

              - { label: "Działalność społeczna (PL)", name: "social_text_pl", widget: "text" }
              - { label: "Action sociale (FR)", name: "social_text_fr", widget: "text", required: false }
              - { label: "Общественная деятельность (RU)", name: "social_text_ru", widget: "text", required: false }
              - { label: "Social activity (EN)", name: "social_text_en", widget: "text", required: false }

          - { label: "Zdjęcie profilowe (awatar)", name: "avatarUrl", widget: "image" }

          - label: "Opinie pacjentów (zatwierdzone ręcznie przez lekarza)"
            name: "reviews"
            widget: "list"
            hint: "Nowe opinie z formularza na stronie NIE trafiają tu automatycznie — przychodzą e-mailem do zatwierdzenia. Po zatwierdzeniu wpisz je tutaj ręcznie."
            fields:
              - { label: "Imię / Inicjały", name: "author", widget: "string" }
              - label: "Kraj"
                name: "country"
                widget: "select"
                options: [{ label: "🇵🇱 Polska", value: "PL" }, { label: "🇫🇷 Francja", value: "FR" }, { label: "🇷🇺 Rosja", value: "RU" }, { label: "🇬🇧 Inny", value: "EN" }]
              - label: "Ocena"
                name: "rating"
                widget: "select"
                options: ["5", "4", "3"]
              - { label: "Treść opinii", name: "text", widget: "text" }
              - { label: "Źródło (np. 'Formularz strony', 'Google')", name: "source", widget: "string", default: "Formularz strony" }

          - label: "Galeria — Kabinet (photos)"
            name: "galleryPhotos"
            widget: "list"
            fields:
              - { label: "Zdjęcie", name: "src", widget: "image" }
              - { label: "Podpis (polski)", name: "caption_pl", widget: "string" }
              - { label: "Podpis (francuski)", name: "caption_fr", widget: "string", required: false }
              - { label: "Podpis (rosyjski)", name: "caption_ru", widget: "string", required: false }
              - { label: "Podpis (angielski)", name: "caption_en", widget: "string", required: false }

          - label: "Galeria — Dyplomy i certyfikaty"
            name: "galleryDocuments"
            widget: "list"
            fields:
              - { label: "Zdjęcie / skan", name: "src", widget: "image" }
              - { label: "Podpis (polski)", name: "caption_pl", widget: "string" }
              - { label: "Podpis (francuski)", name: "caption_fr", widget: "string", required: false }
              - { label: "Podpis (rosyjski)", name: "caption_ru", widget: "string", required: false }
              - { label: "Podpis (angielski)", name: "caption_en", widget: "string", required: false }

          - label: "Blog / linki YouTube"
            name: "blogPosts"
            widget: "list"
            fields:
              - label: "Typ"
                name: "type"
                widget: "select"
                options: ["youtube", "article"]
              - { label: "Link (YouTube lub artykuł)", name: "url", widget: "string" }
              - { label: "Źródło (np. YouTube, Blog)", name: "source", widget: "string" }
              - { label: "Tytuł (polski)", name: "title_pl", widget: "string" }
              - { label: "Tytuł (francuski)", name: "title_fr", widget: "string", required: false }
              - { label: "Tytuł (rosyjski)", name: "title_ru", widget: "string", required: false }
              - { label: "Tytuł (angielski)", name: "title_en", widget: "string", required: false }
              - { label: "Opis (polski)", name: "desc_pl", widget: "text" }
              - { label: "Opis (francuski)", name: "desc_fr", widget: "text", required: false }
              - { label: "Opis (rosyjski)", name: "desc_ru", widget: "text", required: false }
              - { label: "Opis (angielski)", name: "desc_en", widget: "text", required: false }
