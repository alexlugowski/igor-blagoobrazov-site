backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pl"

collections:
  - name: "content"
    label: "Strona — treść"
    editor:
      preview: false
    files:
      - name: "content"
        label: "Весь сайт (Zdjęcia, galeria i blog)"
        file: "content.json"
        description: "Нажмите на нужный раздел, измените и нажмите «Opublikuj» (вверху справа) ОДИН раз в конце. Каждая публикация расходует часть месячного лимита."
        fields:
          - label: "1. 📞 Телефон и WhatsApp"
            name: "contact"
            widget: "object"
            summary: "{{fields.phone_display}}"
            fields:
              - { label: "Телефон — как показать на сайте", name: "phone_display", widget: "string", hint: "Например: +48 22 455 51 15" }
              - { label: "Телефон — только цифры", name: "phone_digits", widget: "string", pattern: ['^[0-9]+$', "Только цифры, без пробелов, плюса и дефисов"], hint: "С кодом страны: 48224555115" }
              - { label: "WhatsApp — только цифры", name: "whatsapp_digits", widget: "string", pattern: ['^[0-9]+$', "Только цифры, без пробелов, плюса и дефисов"], hint: "С кодом страны: 48501234567. Может отличаться от телефона кабинета (личный мобильный). На этом номере должен быть установлен WhatsApp Business." }

          - label: "2. 📝 Тексты сайта (о враче, методы, образование)"
            name: "bio"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Подзаголовок под именем — 🇵🇱 PL (основной)", name: "header_subtitle_pl", widget: "string", hint: "Короткая строка под именем врача вверху сайта." }
              - { label: "Подзаголовок под именем — 🇫🇷 FR", name: "header_subtitle_fr", widget: "string", required: false }
              - { label: "Подзаголовок под именем — 🇷🇺 RU", name: "header_subtitle_ru", widget: "string", required: false }
              - { label: "Подзаголовок под именем — 🇬🇧 EN", name: "header_subtitle_en", widget: "string", required: false }

              - { label: "Строка об опыте — 🇵🇱 PL (основной)", name: "experience_line_pl", widget: "string" }
              - { label: "Строка об опыте — 🇫🇷 FR", name: "experience_line_fr", widget: "string", required: false }
              - { label: "Строка об опыте — 🇷🇺 RU", name: "experience_line_ru", widget: "string", required: false }
              - { label: "Строка об опыте — 🇬🇧 EN", name: "experience_line_en", widget: "string", required: false }

              - { label: "О враче, абзац 1 — 🇵🇱 PL (основной)", name: "about_p1_pl", widget: "text", hint: "Раздел «O mnie» на сайте." }
              - { label: "О враче, абзац 1 — 🇫🇷 FR", name: "about_p1_fr", widget: "text", required: false }
              - { label: "О враче, абзац 1 — 🇷🇺 RU", name: "about_p1_ru", widget: "text", required: false }
              - { label: "О враче, абзац 1 — 🇬🇧 EN", name: "about_p1_en", widget: "text", required: false }

              - { label: "О враче, абзац 2 — 🇵🇱 PL (основной)", name: "about_p2_pl", widget: "text" }
              - { label: "О враче, абзац 2 — 🇫🇷 FR", name: "about_p2_fr", widget: "text", required: false }
              - { label: "О враче, абзац 2 — 🇷🇺 RU", name: "about_p2_ru", widget: "text", required: false }
              - { label: "О враче, абзац 2 — 🇬🇧 EN", name: "about_p2_en", widget: "text", required: false }

              - { label: "Метод 1: название — 🇵🇱 PL (основной)", name: "m1_name_pl", widget: "string", hint: "Блок «Методы лечения» на сайте." }
              - { label: "Метод 1: название — 🇫🇷 FR", name: "m1_name_fr", widget: "string", required: false }
              - { label: "Метод 1: название — 🇷🇺 RU", name: "m1_name_ru", widget: "string", required: false }
              - { label: "Метод 1: название — 🇬🇧 EN", name: "m1_name_en", widget: "string", required: false }

              - { label: "Метод 1: описание — 🇵🇱 PL (основной)", name: "m1_desc_pl", widget: "text" }
              - { label: "Метод 1: описание — 🇫🇷 FR", name: "m1_desc_fr", widget: "text", required: false }
              - { label: "Метод 1: описание — 🇷🇺 RU", name: "m1_desc_ru", widget: "text", required: false }
              - { label: "Метод 1: описание — 🇬🇧 EN", name: "m1_desc_en", widget: "text", required: false }

              - { label: "Метод 2: название — 🇵🇱 PL (основной)", name: "m2_name_pl", widget: "string" }
              - { label: "Метод 2: название — 🇫🇷 FR", name: "m2_name_fr", widget: "string", required: false }
              - { label: "Метод 2: название — 🇷🇺 RU", name: "m2_name_ru", widget: "string", required: false }
              - { label: "Метод 2: название — 🇬🇧 EN", name: "m2_name_en", widget: "string", required: false }

              - { label: "Метод 2: описание — 🇵🇱 PL (основной)", name: "m2_desc_pl", widget: "text" }
              - { label: "Метод 2: описание — 🇫🇷 FR", name: "m2_desc_fr", widget: "text", required: false }
              - { label: "Метод 2: описание — 🇷🇺 RU", name: "m2_desc_ru", widget: "text", required: false }
              - { label: "Метод 2: описание — 🇬🇧 EN", name: "m2_desc_en", widget: "text", required: false }

              - { label: "Метод 3: название — 🇵🇱 PL (основной)", name: "m3_name_pl", widget: "string" }
              - { label: "Метод 3: название — 🇫🇷 FR", name: "m3_name_fr", widget: "string", required: false }
              - { label: "Метод 3: название — 🇷🇺 RU", name: "m3_name_ru", widget: "string", required: false }
              - { label: "Метод 3: название — 🇬🇧 EN", name: "m3_name_en", widget: "string", required: false }

              - { label: "Метод 3: описание — 🇵🇱 PL (основной)", name: "m3_desc_pl", widget: "text" }
              - { label: "Метод 3: описание — 🇫🇷 FR", name: "m3_desc_fr", widget: "text", required: false }
              - { label: "Метод 3: описание — 🇷🇺 RU", name: "m3_desc_ru", widget: "text", required: false }
              - { label: "Метод 3: описание — 🇬🇧 EN", name: "m3_desc_en", widget: "text", required: false }

              - { label: "Метод 4: название — 🇵🇱 PL (основной)", name: "m4_name_pl", widget: "string" }
              - { label: "Метод 4: название — 🇫🇷 FR", name: "m4_name_fr", widget: "string", required: false }
              - { label: "Метод 4: название — 🇷🇺 RU", name: "m4_name_ru", widget: "string", required: false }
              - { label: "Метод 4: название — 🇬🇧 EN", name: "m4_name_en", widget: "string", required: false }

              - { label: "Метод 4: описание — 🇵🇱 PL (основной)", name: "m4_desc_pl", widget: "text" }
              - { label: "Метод 4: описание — 🇫🇷 FR", name: "m4_desc_fr", widget: "text", required: false }
              - { label: "Метод 4: описание — 🇷🇺 RU", name: "m4_desc_ru", widget: "text", required: false }
              - { label: "Метод 4: описание — 🇬🇧 EN", name: "m4_desc_en", widget: "text", required: false }

              - { label: "Образование 1: заголовок (год, учреждение) — 🇵🇱 PL (основной)", name: "edu1_year_pl", widget: "string", hint: "Блок «Образование» на сайте." }
              - { label: "Образование 1: заголовок (год, учреждение) — 🇫🇷 FR", name: "edu1_year_fr", widget: "string", required: false }
              - { label: "Образование 1: заголовок (год, учреждение) — 🇷🇺 RU", name: "edu1_year_ru", widget: "string", required: false }
              - { label: "Образование 1: заголовок (год, учреждение) — 🇬🇧 EN", name: "edu1_year_en", widget: "string", required: false }

              - { label: "Образование 1: описание — 🇵🇱 PL (основной)", name: "edu1_text_pl", widget: "text" }
              - { label: "Образование 1: описание — 🇫🇷 FR", name: "edu1_text_fr", widget: "text", required: false }
              - { label: "Образование 1: описание — 🇷🇺 RU", name: "edu1_text_ru", widget: "text", required: false }
              - { label: "Образование 1: описание — 🇬🇧 EN", name: "edu1_text_en", widget: "text", required: false }

              - { label: "Образование 2: заголовок (год, учреждение) — 🇵🇱 PL (основной)", name: "edu2_year_pl", widget: "string" }
              - { label: "Образование 2: заголовок (год, учреждение) — 🇫🇷 FR", name: "edu2_year_fr", widget: "string", required: false }
              - { label: "Образование 2: заголовок (год, учреждение) — 🇷🇺 RU", name: "edu2_year_ru", widget: "string", required: false }
              - { label: "Образование 2: заголовок (год, учреждение) — 🇬🇧 EN", name: "edu2_year_en", widget: "string", required: false }

              - { label: "Образование 2: описание — 🇵🇱 PL (основной)", name: "edu2_text_pl", widget: "text" }
              - { label: "Образование 2: описание — 🇫🇷 FR", name: "edu2_text_fr", widget: "text", required: false }
              - { label: "Образование 2: описание — 🇷🇺 RU", name: "edu2_text_ru", widget: "text", required: false }
              - { label: "Образование 2: описание — 🇬🇧 EN", name: "edu2_text_en", widget: "text", required: false }

              - { label: "Образование 3: заголовок (год, учреждение) — 🇵🇱 PL (основной)", name: "edu3_year_pl", widget: "string" }
              - { label: "Образование 3: заголовок (год, учреждение) — 🇫🇷 FR", name: "edu3_year_fr", widget: "string", required: false }
              - { label: "Образование 3: заголовок (год, учреждение) — 🇷🇺 RU", name: "edu3_year_ru", widget: "string", required: false }
              - { label: "Образование 3: заголовок (год, учреждение) — 🇬🇧 EN", name: "edu3_year_en", widget: "string", required: false }

              - { label: "Образование 3: описание — 🇵🇱 PL (основной)", name: "edu3_text_pl", widget: "text" }
              - { label: "Образование 3: описание — 🇫🇷 FR", name: "edu3_text_fr", widget: "text", required: false }
              - { label: "Образование 3: описание — 🇷🇺 RU", name: "edu3_text_ru", widget: "text", required: false }
              - { label: "Образование 3: описание — 🇬🇧 EN", name: "edu3_text_en", widget: "text", required: false }

              - { label: "Общественная деятельность — 🇵🇱 PL (основной)", name: "social_text_pl", widget: "text" }
              - { label: "Общественная деятельность — 🇫🇷 FR", name: "social_text_fr", widget: "text", required: false }
              - { label: "Общественная деятельность — 🇷🇺 RU", name: "social_text_ru", widget: "text", required: false }
              - { label: "Общественная деятельность — 🇬🇧 EN", name: "social_text_en", widget: "text", required: false }

          - { label: "3. 🖼 Фото врача (аватар)", name: "avatarUrl", widget: "image", hint: "Квадратное или портретное фото лица. JPG, до 1 МБ." }

          - label: "4. ⭐ Отзывы пациентов (только одобренные вами)"
            name: "reviews"
            widget: "list"
            collapsed: true
            label_singular: "отзыв"
            add_to_top: true
            summary: "{{fields.author}} — {{fields.rating}}★ — {{fields.country}}"
            hint: "Отзывы из формы на сайте сюда сами НЕ попадают: они приходят на e-mail. Если отзыв подходит, нажмите «Dodaj» и впишите его здесь. Не публикуйте данные о здоровье и фамилии пациентов."
            fields:
              - { label: "Имя или инициалы", name: "author", widget: "string" }
              - label: "Страна"
                name: "country"
                widget: "select"
                options: [{ label: "🇵🇱 Польша", value: "PL" }, { label: "🇫🇷 Франция", value: "FR" }, { label: "🇷🇺 Россия", value: "RU" }, { label: "🇬🇧 Другая", value: "EN" }]
              - label: "Оценка"
                name: "rating"
                widget: "select"
                options: ["5", "4", "3"]
              - { label: "Текст отзыва", name: "text", widget: "text" }
              - { label: "Источник", name: "source", widget: "string", default: "Formularz strony", hint: "Например: «Formularz strony» или «Google»" }

          - label: "5. 🏥 Фотографии кабинета (галерея)"
            name: "galleryPhotos"
            widget: "list"
            collapsed: true
            label_singular: "фото"
            summary: "{{fields.caption_pl}}"
            fields:
              - { label: "Фото", name: "src", widget: "image", hint: "Лучше JPG, не шире 1600 px и до 1 МБ. Загружайте с компьютера." }
              - { label: "Подпись 🇵🇱 PL (основная)", name: "caption_pl", widget: "string" }
              - { label: "Подпись 🇫🇷 FR", name: "caption_fr", widget: "string", required: false }
              - { label: "Подпись 🇷🇺 RU", name: "caption_ru", widget: "string", required: false }
              - { label: "Подпись 🇬🇧 EN", name: "caption_en", widget: "string", required: false }

          - label: "6. 🎓 Дипломы и сертификаты"
            name: "galleryDocuments"
            widget: "list"
            collapsed: true
            label_singular: "документ"
            summary: "{{fields.caption_pl}}"
            fields:
              - { label: "Скан или фото документа", name: "src", widget: "image", hint: "Лучше JPG, не шире 1600 px и до 1 МБ. Загружайте с компьютера." }
              - { label: "Подпись 🇵🇱 PL (основная)", name: "caption_pl", widget: "string" }
              - { label: "Подпись 🇫🇷 FR", name: "caption_fr", widget: "string", required: false }
              - { label: "Подпись 🇷🇺 RU", name: "caption_ru", widget: "string", required: false }
              - { label: "Подпись 🇬🇧 EN", name: "caption_en", widget: "string", required: false }

          - label: "7. ▶️ Блог и YouTube (ссылки)"
            name: "blogPosts"
            widget: "list"
            collapsed: true
            label_singular: "ссылку"
            add_to_top: true
            summary: "{{fields.title_pl}}"
            fields:
              - label: "Тип"
                name: "type"
                widget: "select"
                options: [{ label: "Видео YouTube", value: "youtube" }, { label: "Статья или пост", value: "article" }]
              - { label: "Ссылка", name: "url", widget: "string", hint: "Скопируйте адрес видео или статьи из браузера целиком (начинается с https://)" }
              - { label: "Источник", name: "source", widget: "string", hint: "Например: YouTube или Blog" }
              - { label: "Заголовок 🇵🇱 PL (основной)", name: "title_pl", widget: "string" }
              - { label: "Заголовок 🇫🇷 FR", name: "title_fr", widget: "string", required: false }
              - { label: "Заголовок 🇷🇺 RU", name: "title_ru", widget: "string", required: false }
              - { label: "Заголовок 🇬🇧 EN", name: "title_en", widget: "string", required: false }
              - { label: "Описание 🇵🇱 PL (основное)", name: "desc_pl", widget: "text" }
              - { label: "Описание 🇫🇷 FR", name: "desc_fr", widget: "text", required: false }
              - { label: "Описание 🇷🇺 RU", name: "desc_ru", widget: "text", required: false }
              - { label: "Описание 🇬🇧 EN", name: "desc_en", widget: "text", required: false }
